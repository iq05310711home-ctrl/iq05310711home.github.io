<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文化拉麵店 - 線上點餐系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c41e3a;
            --primary-dark: #8b1428;
            --secondary: #2d1810;
            --cream: #faf8f3;
            --warm-white: #fff9f0;
            --bamboo: #8b7355;
            --gold: #d4af37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--cream);
            color: var(--secondary);
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, rgba(45, 24, 16, 0.95) 0%, rgba(139, 20, 40, 0.95) 100%),
                        url('https://images.unsplash.com/photo-1557872943-16a5ac26437e?w=1200') center/cover;
            color: var(--warm-white);
            padding: 2.5rem 2rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-30px, -30px) rotate(10deg); }
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid var(--gold);
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: slideDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.95;
            margin-bottom: 1.5rem;
            animation: slideDown 0.8s ease-out 0.2s backwards;
        }

        .contact-info {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            font-size: 0.95rem;
            animation: slideDown 0.8s ease-out 0.4s backwards;
        }

        .contact-info div {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .contact-info span {
            opacity: 0.9;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* Menu Section */
        .menu-section {
            background: var(--warm-white);
            border-radius: 20px;
            padding: 3rem;
            margin-bottom: 3rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            position: relative;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid var(--primary);
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100px;
            height: 3px;
            background: var(--gold);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .menu-item {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(196, 30, 58, 0.15);
            border-color: var(--primary);
        }

        .item-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .menu-item:hover .item-image {
            transform: scale(1.05);
        }

        .item-content {
            padding: 1.5rem;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.8rem;
        }

        .item-name {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--secondary);
            font-family: 'Noto Serif TC', serif;
        }

        .item-price {
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 700;
        }

        .item-description {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .qty-btn {
            width: 36px;
            height: 36px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }

        .qty-btn:active {
            transform: scale(0.95);
        }

        .qty-display {
            min-width: 40px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Cart Section */
        .cart-section {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 10px 40px rgba(196, 30, 58, 0.3);
            position: sticky;
            top: 20px;
            animation: fadeInUp 0.6s ease-out 0.3s backwards;
        }

        .cart-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cart-items {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 2rem;
            padding-right: 0.5rem;
        }

        .cart-items::-webkit-scrollbar {
            width: 8px;
        }

        .cart-items::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .cart-items::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
        }

        .cart-item {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: slideInRight 0.3s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .cart-item-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .cart-item-details {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .remove-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .remove-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .cart-total {
            border-top: 2px solid rgba(255,255,255,0.3);
            padding-top: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'Noto Serif TC', serif;
        }

        .checkout-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--gold);
            color: var(--secondary);
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .checkout-btn:hover {
            background: #e6c550;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .checkout-btn:active {
            transform: translateY(0);
        }

        .checkout-btn:disabled {
            background: #888;
            cursor: not-allowed;
            transform: none;
        }

        .empty-cart {
            text-align: center;
            padding: 3rem 1rem;
            opacity: 0.7;
            font-size: 1.1rem;
        }

        /* Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 3rem;
            align-items: start;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            animation: scaleIn 0.3s ease-out;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .modal-message {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .modal-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 3rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* Image Upload Note */
        .image-note {
            background: #fff3cd;
            border: 2px dashed #ffc107;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .image-note h3 {
            color: #856404;
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .image-note p {
            color: #856404;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .image-note code {
            background: #fff;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: monospace;
            color: #d63384;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            .cart-section {
                position: static;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .logo {
                width: 70px;
                height: 70px;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .contact-info {
                flex-direction: column;
                gap: 0.8rem;
            }

            .menu-section,
            .cart-section {
                padding: 2rem 1.5rem;
            }

            .header-top {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-top">
                <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=200" alt="文化拉麵店 Logo" class="logo">
                <h1>文化拉麵店</h1>
            </div>
            <div class="subtitle">道地日式拉麵 · 用心熬製美味</div>
            <div class="contact-info">
                <div>
                    <span>📍</span>
                    <span>臺北市11114陽明山華岡路55號</span>
                </div>
                <div>
                    <span>📞</span>
                    <span>123455568</span>
                </div>
            </div>
        </div>
    </header>

    <div class="container">

        <div class="main-layout">
            <div>
                <!-- 拉麵類 -->
                <div class="menu-section">
                    <h2 class="section-title">🍜 招牌拉麵</h2>
                    <div class="menu-grid" id="ramen-menu"></div>
                </div>

                <!-- 小菜類 -->
                <div class="menu-section">
                    <h2 class="section-title">🥟 精選小菜</h2>
                    <div class="menu-grid" id="side-menu"></div>
                </div>

                <!-- 飲料類 -->
                <div class="menu-section">
                    <h2 class="section-title">🥤 飲品</h2>
                    <div class="menu-grid" id="drink-menu"></div>
                </div>
            </div>

            <!-- 購物車 -->
            <div class="cart-section">
                <h2 class="cart-title">🛒 購物車</h2>
                <div class="cart-items" id="cart-items">
                    <div class="empty-cart">購物車是空的<br>快來點些美味的拉麵吧！</div>
                </div>
                <div class="cart-total">
                    <div class="total-row">
                        <span>總計</span>
                        <span id="total-price">NT$ 0</span>
                    </div>
                </div>
                <button class="checkout-btn" id="checkout-btn" disabled>確認送出訂單</button>
            </div>
        </div>
    </div>

    <!-- 訂單確認Modal -->
    <div class="modal" id="order-modal">
        <div class="modal-content">
            <div class="modal-icon">✅</div>
            <h3 class="modal-title">訂單已送出！</h3>
            <p class="modal-message">感謝您的訂購！<br>我們會盡快為您準備美味的拉麵。<br>請稍候，您的餐點即將送達！</p>
            <button class="modal-btn" onclick="closeModal()">確定</button>
        </div>
    </div>

    <script>
        // 菜單數據（包含圖片）
        const menuData = {
            ramen: [
                { 
                    id: 1, 
                    name: '豚骨拉麵', 
                    price: 180, 
                    image: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400',
                    description: '濃郁豚骨湯底，細麵，叉燒肉，溏心蛋，筍乾，蔥花' 
                },
                { 
                    id: 2, 
                    name: '味噌拉麵', 
                    price: 170, 
                    image: 'https://images.unsplash.com/photo-1623341214825-9f4f963727da?w=400',
                    description: '濃厚味噌湯頭，中粗麵，豆芽菜，玉米，奶油，海苔' 
                },
                { 
                    id: 3, 
                    name: '醬油拉麵', 
                    price: 160, 
                    image: 'https://images.unsplash.com/photo-1557872943-16a5ac26437e?w=400',
                    description: '清爽醬油湯底，細麵，叉燒肉，筍乾，蔥花，海苔' 
                },
                { 
                    id: 4, 
                    name: '辣味拉麵', 
                    price: 190, 
                    image: 'https://images.unsplash.com/photo-1617093727343-374698b1b08d?w=400',
                    description: '特製麻辣湯底，粗麵，叉燒肉，辣油，蔥花，木耳' 
                },
                { 
                    id: 5, 
                    name: '海鮮拉麵', 
                    price: 220, 
                    image: 'https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?w=400',
                    description: '鮮美海鮮湯頭，細麵，蝦子，花枝，蛤蜊，海帶芽' 
                },
                { 
                    id: 6, 
                    name: '雞白湯拉麵', 
                    price: 175, 
                    image: 'https://images.unsplash.com/photo-1591814468924-caf88d1232e1?w=400',
                    description: '濃郁雞白湯，中細麵，雞肉，溏心蛋，筍乾，蔥花' 
                }
            ],
            sides: [
                { 
                    id: 7, 
                    name: '日式煎餃', 
                    price: 80, 
                    image: 'https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=400',
                    description: '外酥內嫩，豬肉高麗菜餡（6顆）' 
                },
                { 
                    id: 8, 
                    name: '唐揚雞', 
                    price: 90, 
                    image: 'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=400',
                    description: '日式炸雞，酥脆多汁（5塊）' 
                },
                { 
                    id: 9, 
                    name: '溏心蛋', 
                    price: 30, 
                    image: 'https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=400',
                    description: '完美半熟蛋黃，醬油滷製（1顆）' 
                },
                { 
                    id: 10, 
                    name: '叉燒肉', 
                    price: 60, 
                    image: 'https://images.unsplash.com/photo-1624300629298-e9de39c13be5?w=400',
                    description: '軟嫩叉燒肉片（3片）' 
                },
                { 
                    id: 11, 
                    name: '海帶芽', 
                    price: 40, 
                    image: 'https://images.unsplash.com/photo-1604908177453-7462950a6a3b?w=400',
                    description: '清爽海帶芽小菜' 
                },
                { 
                    id: 12, 
                    name: '日式炒飯', 
                    price: 70, 
                    image: 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=400',
                    description: '蛋炒飯，蔥花，醬油調味' 
                }
            ],
            drinks: [
                { 
                    id: 13, 
                    name: '綠茶', 
                    price: 30, 
                    image: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400',
                    description: '無糖日式綠茶' 
                },
                { 
                    id: 14, 
                    name: '可樂', 
                    price: 35, 
                    image: 'https://images.unsplash.com/photo-1581006852262-e4307cf6283a?w=400',
                    description: '冰涼可口可樂' 
                },
                { 
                    id: 15, 
                    name: '烏龍茶', 
                    price: 30, 
                    image: 'https://images.unsplash.com/photo-1564890369478-c89ca6d9cde9?w=400',
                    description: '無糖烏龍茶' 
                },
                { 
                    id: 16, 
                    name: '啤酒', 
                    price: 80, 
                    image: 'https://images.unsplash.com/photo-1608270586620-248524c67de9?w=400',
                    description: '日本進口啤酒' 
                },
                { 
                    id: 17, 
                    name: '柚子茶', 
                    price: 45, 
                    image: 'https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=400',
                    description: '清新柚子風味' 
                },
                { 
                    id: 18, 
                    name: '抹茶拿鐵', 
                    price: 70, 
                    image: 'https://images.unsplash.com/photo-1515823662972-da6a2e4d3002?w=400',
                    description: '香濃抹茶配牛奶' 
                }
            ]
        };

        // 購物車
        let cart = [];

        // 渲染菜單
        function renderMenu() {
            renderCategory('ramen', 'ramen-menu');
            renderCategory('sides', 'side-menu');
            renderCategory('drinks', 'drink-menu');
        }

        function renderCategory(category, containerId) {
            const container = document.getElementById(containerId);
            const items = menuData[category];
            
            container.innerHTML = items.map(item => `
                <div class="menu-item">
                    <img src="${item.image}" alt="${item.name}" class="item-image">
                    <div class="item-content">
                        <div class="item-header">
                            <div class="item-name">${item.name}</div>
                            <div class="item-price">NT$ ${item.price}</div>
                        </div>
                        <div class="item-description">${item.description}</div>
                        <div class="quantity-control">
                            <button class="qty-btn" onclick="decreaseQty(${item.id})">−</button>
                            <div class="qty-display" id="qty-${item.id}">0</div>
                            <button class="qty-btn" onclick="increaseQty(${item.id})">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 增加數量
        function increaseQty(itemId) {
            const item = findItemById(itemId);
            const cartItem = cart.find(i => i.id === itemId);
            
            if (cartItem) {
                cartItem.quantity++;
            } else {
                cart.push({ ...item, quantity: 1 });
            }
            
            updateDisplay();
        }

        // 減少數量
        function decreaseQty(itemId) {
            const cartItem = cart.find(i => i.id === itemId);
            
            if (cartItem) {
                cartItem.quantity--;
                if (cartItem.quantity <= 0) {
                    cart = cart.filter(i => i.id !== itemId);
                }
            }
            
            updateDisplay();
        }

        // 移除項目
        function removeItem(itemId) {
            cart = cart.filter(i => i.id !== itemId);
            updateDisplay();
        }

        // 更新顯示
        function updateDisplay() {
            // 更新數量顯示
            document.querySelectorAll('[id^="qty-"]').forEach(el => {
                const itemId = parseInt(el.id.split('-')[1]);
                const cartItem = cart.find(i => i.id === itemId);
                el.textContent = cartItem ? cartItem.quantity : 0;
            });

            // 更新購物車
            const cartContainer = document.getElementById('cart-items');
            
            if (cart.length === 0) {
                cartContainer.innerHTML = '<div class="empty-cart">購物車是空的<br>快來點些美味的拉麵吧！</div>';
                document.getElementById('checkout-btn').disabled = true;
            } else {
                cartContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}" class="cart-item-image">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-details">數量: ${item.quantity} × NT$ ${item.price}</div>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${item.id})">×</button>
                    </div>
                `).join('');
                document.getElementById('checkout-btn').disabled = false;
            }

            // 更新總價
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('total-price').textContent = `NT$ ${total}`;
        }

        // 查找菜單項目
        function findItemById(id) {
            for (let category in menuData) {
                const item = menuData[category].find(i => i.id === id);
                if (item) return item;
            }
            return null;
        }

        // 結帳
        document.getElementById('checkout-btn').addEventListener('click', function() {
            if (cart.length > 0) {
                document.getElementById('order-modal').classList.add('active');
                // 清空購物車
                setTimeout(() => {
                    cart = [];
                    updateDisplay();
                }, 1500);
            }
        });

        // 關閉Modal
        function closeModal() {
            document.getElementById('order-modal').classList.remove('active');
        }

        // 初始化
        renderMenu();
    </script>
</body>
</html>
